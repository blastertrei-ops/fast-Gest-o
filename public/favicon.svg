<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="45%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0040E6" />
    </linearGradient>
    <linearGradient id="truckBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <!-- BLUE SQUIRCLE BADGE BACKGROUND -->
  <rect width="512" height="512" rx="115" fill="url(#blueBadgeGrad)" />

  <!-- SUBTLE GROUND SHADOW BELOW TRUCK -->
  <ellipse cx="256" cy="405" rx="120" ry="8" fill="#0038C8" opacity="0.35" />

  <!-- TRUCK & SPEED LINES GROUP -->
  <g id="fast-delivery-truck" transform="translate(10, 15)">
    <!-- SPEED LINES LEFT -->
    <rect x="145" y="195" width="75" height="18" rx="9" fill="#FFFFFF" />
    <rect x="180" y="230" width="40" height="16" rx="8" fill="#FFFFFF" />
    <rect x="90" y="265" width="130" height="22" rx="11" fill="#FFFFFF" />
    <rect x="140" y="308" width="80" height="16" rx="8" fill="#FFFFFF" />
    <rect x="110" y="344" width="110" height="18" rx="9" fill="#FFFFFF" />
    <circle cx="102" cy="316" r="8" fill="#FFFFFF" />

    <!-- TRUCK CARGO BOX -->
    <path d="M 205 180 C 195 180 190 188 190 200 L 190 325 C 190 335 198 340 210 340 L 310 340 L 310 200 C 310 188 302 180 290 180 Z" fill="url(#truckBodyGrad)" />

    <!-- TRUCK CABIN FRONT -->
    <path d="M 305 200 L 345 200 C 360 200 375 220 385 245 L 398 285 C 402 298 402 320 395 330 C 390 338 380 340 370 340 L 305 340 Z" fill="url(#truckBodyGrad)" />

    <!-- CABIN WINDSHIELD WINDOW -->
    <path d="M 320 218 L 345 218 C 352 218 360 230 365 245 L 372 272 C 374 278 370 282 362 282 L 320 282 C 316 282 314 278 314 272 L 314 226 C 314 220 316 218 320 218 Z" fill="#0066FF" />

    <!-- CABIN DOOR HANDLE -->
    <rect x="330" y="295" width="14" height="6" rx="3" fill="#0066FF" />

    <!-- WHEEL 1 (LEFT) -->
    <g transform="translate(208, 332)">
      <circle cx="28" cy="28" r="28" fill="#FFFFFF" />
      <circle cx="28" cy="28" r="17" fill="#0066FF" />
      <circle cx="28" cy="28" r="7" fill="#FFFFFF" />
    </g>

    <!-- WHEEL 2 (RIGHT) -->
    <g transform="translate(322, 332)">
      <circle cx="28" cy="28" r="28" fill="#FFFFFF" />
      <circle cx="28" cy="28" r="17" fill="#0066FF" />
      <circle cx="28" cy="28" r="7" fill="#FFFFFF" />
    </g>
  </g>
</svg>