<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fast Gestão - Sistema Oficial de Entregas" />
    <meta property="og:description" content="Sistema de gestão e rastreamento de entregas com a nova identidade visual oficial." />
    <meta property="og:image" content="/fast-gestao-logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fast Gestão - Sistema Oficial de Entregas" />
    <meta name="twitter:description" content="Sistema de gestão e rastreamento de entregas com a nova identidade visual oficial." />
    <meta name="twitter:image" content="/fast-gestao-logo.png" />
    <title>Fast Gestão - Sistema de Entregas</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('SW registrado com sucesso:', reg.scope),
            (err) => console.log('Falha ao registrar SW:', err)
          );
        });
      }
    </script>
  </body>
</html>
